<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brassFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5912"/>
      <stop offset="50%" stop-color="#f7cf62"/>
      <stop offset="100%" stop-color="#6c4108"/>
    </linearGradient>
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7ab2d6" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe787"/>
      <stop offset="100%" stop-color="#d6851c"/>
    </linearGradient>
  </defs>
  <!-- Pillars -->
  <line x1="8.5" y1="5.5" x2="8.5" y2="26.5" stroke="#1b1108" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="8.5" y1="5.5" x2="8.5" y2="26.5" stroke="url(#brassFrame)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="23.5" y1="5.5" x2="23.5" y2="26.5" stroke="#1b1108" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="23.5" y1="5.5" x2="23.5" y2="26.5" stroke="url(#brassFrame)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Glass bulbs -->
  <path d="M10.2 5.8 L21.8 5.8 C21.8 11.2, 17.5 14.3, 16 16 C17.5 17.7, 21.8 20.8, 21.8 26.2 L10.2 26.2 C10.2 20.8, 14.5 17.7, 16 16 C14.5 14.3, 10.2 11.2, 10.2 5.8 Z"
        fill="url(#glassTint)" stroke="#1b1108" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- Top sand -->
  <path d="M11.6 8.5 L20.4 8.5 C19.8 11.6, 17.3 13.7, 16 15.1 C14.7 13.7, 12.2 11.6, 11.6 8.5 Z"
        fill="url(#sandGrad)" stroke="#6d3e08" stroke-width="0.6"/>
  <!-- Falling trickle -->
  <line x1="16" y1="15.3" x2="16" y2="21.5" stroke="#ffdf6e" stroke-width="1.1"/>
  <!-- Bottom sand mound -->
  <path d="M11.2 25.5 C12.6 22.0, 14.8 20.6, 16 20.6 C17.2 20.6, 19.4 22.0, 20.8 25.5 Z"
        fill="url(#sandGrad)" stroke="#6d3e08" stroke-width="0.6"/>
  <!-- Top and bottom caps -->
  <rect x="6" y="3" width="20" height="3.2" rx="1" fill="url(#brassFrame)" stroke="#1b1108" stroke-width="1.3"/>
  <rect x="6" y="25.8" width="20" height="3.2" rx="1" fill="url(#brassFrame)" stroke="#1b1108" stroke-width="1.3"/>
</svg>
