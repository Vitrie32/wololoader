  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgMerc)" stroke="#140908" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#d4a64a" stroke-width="0.9" stroke-opacity="0.75"/>
