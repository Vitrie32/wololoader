<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#194429"/>
      <stop offset="100%" stop-color="#0b2013"/>
    </linearGradient>
    <linearGradient id="woodBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3a857"/>
      <stop offset="50%" stop-color="#9e5e22"/>
      <stop offset="100%" stop-color="#58300e"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgArch)" stroke="#0d1710" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#d4a64a" stroke-width="0.9" stroke-opacity="0.75"/>
  <!-- Bowstring -->
  <line x1="11.5" y1="7" x2="11.5" y2="29" stroke="#e8dec0" stroke-width="1.1"/>
  <!-- Curved longbow -->
  <path d="M11.5 7 C20.5 9.5, 22.5 15, 22.5 18 C22.5 21, 20.5 26.5, 11.5 29"
        fill="none" stroke="#1b1006" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M11.5 7 C20.5 9.5, 22.5 15, 22.5 18 C22.5 21, 20.5 26.5, 11.5 29"
        fill="none" stroke="url(#woodBow)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Nocked arrow -->
  <line x1="8" y1="18" x2="28" y2="18" stroke="#1b1006" stroke-width="3.0" stroke-linecap="round"/>
  <line x1="8" y1="18" x2="28" y2="18" stroke="#e8c878" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Steel arrowhead -->
  <polygon points="30.5,18 25,14.8 26.2,18 25,21.2" fill="#e6eef7" stroke="#161d24" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- Crimson fletching -->
  <polygon points="7.5,18 11.5,15.3 13,18 11.5,20.7" fill="#d1322a" stroke="#240806" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
