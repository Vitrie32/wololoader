<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="bgTower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#223859"/>
      <stop offset="100%" stop-color="#0e1828"/>
    </linearGradient>
    <linearGradient id="stoneWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4cec4"/>
      <stop offset="55%" stop-color="#9e988e"/>
      <stop offset="100%" stop-color="#69645c"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgTower)" stroke="#0d131d" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#d4a64a" stroke-width="0.9" stroke-opacity="0.75"/>
  <!-- Pennant flag -->
  <line x1="18" y1="4.5" x2="18" y2="10" stroke="#1b1108" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="18.5,4.8 26.5,6.8 18.5,9" fill="#d93228" stroke="#1b1108" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- Tower body with battlements -->
  <path d="M10.5 9.5 L13.5 9.5 L13.5 11.5 L16.2 11.5 L16.2 9.5 L19.8 9.5 L19.8 11.5 L22.5 11.5 L22.5 9.5 L25.5 9.5 L25.5 14.5 L23.5 16 L24.5 29.5 L11.5 29.5 L12.5 16 L10.5 14.5 Z"
        fill="url(#stoneWall)" stroke="#1b1610" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Masonry lines -->
  <line x1="12.2" y1="20" x2="23.8" y2="20" stroke="#57524b" stroke-width="0.9"/>
  <line x1="11.9" y1="24.5" x2="24.1" y2="24.5" stroke="#57524b" stroke-width="0.9"/>
  <!-- Glowing torch slit -->
  <rect x="16.7" y="16" width="2.6" height="5.5" rx="1" fill="#ffbe3b" stroke="#2b1906" stroke-width="1"/>
  <!-- Wooden gate -->
  <path d="M15.2 29.5 L15.2 25.2 C15.2 23.5, 20.8 23.5, 20.8 25.2 L20.8 29.5 Z"
        fill="#6e411a" stroke="#1f1106" stroke-width="1"/>
</svg>
