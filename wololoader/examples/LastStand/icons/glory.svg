<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="gloryGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#fff6bd" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#f0b232" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8c4e08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laurelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#eab334"/>
      <stop offset="100%" stop-color="#965d0a"/>
    </linearGradient>
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d63129"/>
      <stop offset="100%" stop-color="#7c120d"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="15" r="14" fill="url(#gloryGlow)"/>
  <!-- Left & right laurel branches -->
  <g fill="url(#laurelGold)" stroke="#231406" stroke-width="1.1" stroke-linejoin="round">
    <!-- Left leaves -->
    <ellipse cx="7.5" cy="19.5" rx="3.4" ry="1.8" transform="rotate(-55 7.5 19.5)"/>
    <ellipse cx="6.3" cy="15.0" rx="3.5" ry="1.8" transform="rotate(-78 6.3 15.0)"/>
    <ellipse cx="7.3" cy="10.2" rx="3.4" ry="1.8" transform="rotate(-110 7.3 10.2)"/>
    <ellipse cx="10.2" cy="6.5" rx="3.3" ry="1.7" transform="rotate(-138 10.2 6.5)"/>
    <ellipse cx="10.8" cy="23.2" rx="3.2" ry="1.7" transform="rotate(-30 10.8 23.2)"/>
    <!-- Right leaves -->
    <ellipse cx="24.5" cy="19.5" rx="3.4" ry="1.8" transform="rotate(55 24.5 19.5)"/>
    <ellipse cx="25.7" cy="15.0" rx="3.5" ry="1.8" transform="rotate(78 25.7 15.0)"/>
    <ellipse cx="24.7" cy="10.2" rx="3.4" ry="1.8" transform="rotate(110 24.7 10.2)"/>
    <ellipse cx="21.8" cy="6.5" rx="3.3" ry="1.7" transform="rotate(138 21.8 6.5)"/>
    <ellipse cx="21.2" cy="23.2" rx="3.2" ry="1.7" transform="rotate(30 21.2 23.2)"/>
  </g>
  <!-- Central star emblem -->
  <polygon points="16,7.5 18.1,12.2 23.2,12.7 19.3,16.1 20.5,21.1 16,18.4 11.5,21.1 12.7,16.1 8.8,12.7 13.9,12.2"
           fill="#ffe875" stroke="#2a1605" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Crimson ribbon tie at base -->
  <path d="M12.5 24.2 L16 25.8 L19.5 24.2 L21.5 29 L17.4 27.6 L16 29.5 L14.6 27.6 L10.5 29 Z"
        fill="url(#ribbonRed)" stroke="#231406" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
