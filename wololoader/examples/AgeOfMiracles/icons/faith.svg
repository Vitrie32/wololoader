<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fff9cc" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffd24c" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#b8730a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haloRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4a8"/>
      <stop offset="50%" stop-color="#f0b634"/>
      <stop offset="100%" stop-color="#9e5f0b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e87018"/>
    </linearGradient>
    <linearGradient id="waxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8dcc0"/>
      <stop offset="55%" stop-color="#fff7e2"/>
      <stop offset="100%" stop-color="#bfa87a"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c6b1c"/>
      <stop offset="50%" stop-color="#f2ca63"/>
      <stop offset="100%" stop-color="#7a4c0c"/>
    </linearGradient>
  </defs>
  <!-- Outer radiant glow -->
  <circle cx="16" cy="12" r="14" fill="url(#haloGlow)"/>
  <!-- Golden halo ring behind flame -->
  <ellipse cx="16" cy="10.5" rx="9.5" ry="7.5" fill="none" stroke="#3a2108" stroke-width="3.2"/>
  <ellipse cx="16" cy="10.5" rx="9.5" ry="7.5" fill="none" stroke="url(#haloRing)" stroke-width="1.8"/>
  <!-- Candle flame -->
  <path d="M16 4.2 C18.8 7.8, 19.2 11.4, 16 13.6 C12.8 11.4, 13.2 7.8, 16 4.2 Z"
        fill="url(#flameGrad)" stroke="#3a2108" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M16 7.5 C17.1 9.4, 17.1 11.2, 16 12.4 C14.9 11.2, 14.9 9.4, 16 7.5 Z"
        fill="#fffef0"/>
  <!-- Wick -->
  <line x1="16" y1="13.4" x2="16" y2="15.2" stroke="#2c1906" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Candle body with wax drip -->
  <path d="M11.8 15.2 L20.2 15.2 L20.2 26 L11.8 26 Z"
        fill="url(#waxGrad)" stroke="#3a2108" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M13 15.4 C13 18.2, 14.5 18.2, 14.5 16.3 C14.5 15.7, 15.5 15.7, 15.5 19.0 C15.5 20.1, 16.8 20.1, 16.8 17.0 L16.8 15.4 Z"
        fill="#fff8e8" stroke="#8a7450" stroke-width="0.6"/>
  <!-- Brass candle holder -->
  <path d="M9.5 26 L22.5 26 L21 29.5 L11 29.5 Z"
        fill="url(#brassGrad)" stroke="#3a2108" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
