<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="bgPlague" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#35203b"/>
      <stop offset="100%" stop-color="#140c18"/>
    </linearGradient>
    <radialGradient id="miasma" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#9eff4f" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#489e24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e420e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8cf"/>
      <stop offset="65%" stop-color="#c4b894"/>
      <stop offset="100%" stop-color="#877d5c"/>
    </linearGradient>
  </defs>
  <!-- Framed medieval tile -->
  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgPlague)" stroke="#140c16" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#6aa844" stroke-width="0.9" stroke-opacity="0.65"/>
  <!-- Pestilence miasma glow -->
  <circle cx="18" cy="18" r="14" fill="url(#miasma)"/>
  <!-- Swirling toxic clouds -->
  <path d="M6 25 C8 20, 12 21, 14 24 C17 22, 21 22, 24 25 C27 23, 30 25, 29 29 L7 29 Z"
        fill="#59a82e" fill-opacity="0.7" stroke="#1b2e10" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- Medieval skull -->
  <path d="M18 7 C12.5 7, 9.5 11.2, 9.8 16.2 C10 19, 12 20.5, 13 22 L13 25.5 L23 25.5 L23 22 C24 20.5, 26 19, 26.2 16.2 C26.5 11.2, 23.5 7, 18 7 Z"
        fill="url(#boneGrad)" stroke="#1e1712" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Eye sockets & nose -->
  <ellipse cx="14.3" cy="16.2" rx="2.2" ry="2.5" fill="#1e1712"/>
  <ellipse cx="21.7" cy="16.2" rx="2.2" ry="2.5" fill="#1e1712"/>
  <circle cx="14.3" cy="16.2" r="0.9" fill="#9eff4f"/>
  <circle cx="21.7" cy="16.2" r="0.9" fill="#9eff4f"/>
  <polygon points="18,18.2 16.7,21 19.3,21" fill="#1e1712"/>
  <!-- Teeth -->
  <line x1="15.2" y1="22.8" x2="15.2" y2="25.5" stroke="#1e1712" stroke-width="1.1"/>
  <line x1="18" y1="22.8" x2="18" y2="25.5" stroke="#1e1712" stroke-width="1.1"/>
  <line x1="20.8" y1="22.8" x2="20.8" y2="25.5" stroke="#1e1712" stroke-width="1.1"/>
</svg>
