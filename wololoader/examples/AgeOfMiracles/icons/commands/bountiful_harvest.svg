<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="bgHarvest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d421d"/>
      <stop offset="100%" stop-color="#2c1c0b"/>
    </linearGradient>
    <linearGradient id="wheatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe785"/>
      <stop offset="55%" stop-color="#e3a82b"/>
      <stop offset="100%" stop-color="#9e6712"/>
    </linearGradient>
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff8566"/>
      <stop offset="60%" stop-color="#c9281e"/>
      <stop offset="100%" stop-color="#6e0e08"/>
    </radialGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c5a2b"/>
      <stop offset="50%" stop-color="#c48a47"/>
      <stop offset="100%" stop-color="#6b4019"/>
    </linearGradient>
  </defs>
  <!-- Framed medieval tile -->
  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgHarvest)" stroke="#1a1006" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#c79542" stroke-width="0.9" stroke-opacity="0.7"/>
  <!-- Golden wheat stalks fanned behind -->
  <g stroke="#241506" stroke-width="1.2" stroke-linejoin="round" fill="url(#wheatGrad)">
    <path d="M18 22 C14 16, 10 11, 7 6 C11 7, 15 12, 18 19 Z"/>
    <path d="M18 22 C18 15, 18 10, 18 4.5 C20.5 9, 20.5 15, 18 22 Z"/>
    <path d="M18 22 C22 16, 26 11, 29 6 C25 7, 21 12, 18 19 Z"/>
    <ellipse cx="11.5" cy="9.5" rx="2.1" ry="3.4" transform="rotate(-32 11.5 9.5)"/>
    <ellipse cx="18" cy="8.2" rx="2.2" ry="3.7"/>
    <ellipse cx="24.5" cy="9.5" rx="2.1" ry="3.4" transform="rotate(32 24.5 9.5)"/>
  </g>
  <!-- Red apples nestled in basket -->
  <circle cx="13.2" cy="21" r="4.3" fill="url(#appleGrad)" stroke="#241506" stroke-width="1.2"/>
  <circle cx="22.8" cy="21" r="4.3" fill="url(#appleGrad)" stroke="#241506" stroke-width="1.2"/>
  <circle cx="18" cy="19.5" r="4.6" fill="url(#appleGrad)" stroke="#241506" stroke-width="1.2"/>
  <!-- Apple leaf accent -->
  <path d="M18 15.2 C19.5 13, 22 13.5, 21.8 15.3 C20.4 16, 18.8 15.8, 18 15.2 Z" fill="#63a832" stroke="#1e2b0d" stroke-width="0.9"/>
  <!-- Woven harvest basket -->
  <path d="M7.5 22.5 L28.5 22.5 L25.5 31 L10.5 31 Z" fill="url(#basketGrad)" stroke="#241506" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="9" y1="25.5" x2="27" y2="25.5" stroke="#3d230c" stroke-width="1.1"/>
  <line x1="10" y1="28.3" x2="26" y2="28.3" stroke="#3d230c" stroke-width="1.1"/>
  <rect x="6.5" y="21.2" width="23" height="2.6" rx="1.2" fill="#d49c55" stroke="#241506" stroke-width="1.2"/>
</svg>
