<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="bgWar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e355c"/>
      <stop offset="100%" stop-color="#0d172b"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f6fa"/>
      <stop offset="50%" stop-color="#a8b8c8"/>
      <stop offset="100%" stop-color="#5d6b7a"/>
    </linearGradient>
    <linearGradient id="hiltGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87018"/>
      <stop offset="50%" stop-color="#ffe073"/>
      <stop offset="100%" stop-color="#87540d"/>
    </linearGradient>
  </defs>
  <!-- Framed medieval tile -->
  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgWar)" stroke="#141824" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#d1a84b" stroke-width="0.9" stroke-opacity="0.7"/>
  <!-- Halo behind shield -->
  <circle cx="18" cy="17" r="11" fill="none" stroke="#f2c44d" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Crossed swords behind shield -->
  <g stroke="#1b140c" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="7,6 10,5.5 27,25.5 25,27.5" fill="url(#steelGrad)"/>
    <polygon points="29,6 26,5.5 9,25.5 11,27.5" fill="url(#steelGrad)"/>
    <!-- Hilts -->
    <line x1="23.5" y1="28.5" x2="29" y2="23" stroke="url(#hiltGold)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="12.5" y1="28.5" x2="7" y2="23" stroke="url(#hiltGold)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="26.5" y1="26.5" x2="29.5" y2="30" stroke="#4a2c0c" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="9.5" y1="26.5" x2="6.5" y2="30" stroke="#4a2c0c" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Heater shield with crimson sacred cross -->
  <path d="M11 9.5 L25 9.5 L25 19.5 C25 24.5, 18 28.8, 18 28.8 C18 28.8, 11 24.5, 11 19.5 Z"
        fill="url(#steelGrad)" stroke="#1a120a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M16.4 11.2 L19.6 11.2 L19.6 15.8 L23.5 15.8 L23.5 18.8 L19.6 18.8 L19.6 25.8 L16.4 25.8 L16.4 18.8 L12.5 18.8 L12.5 15.8 L16.4 15.8 Z"
        fill="#b81d18" stroke="#3b0907" stroke-width="0.9" stroke-linejoin="round"/>
  <circle cx="18" cy="17.3" r="1.5" fill="#ffd85e" stroke="#523308" stroke-width="0.7"/>
</svg>
