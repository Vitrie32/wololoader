<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="bgFavour" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c1f24"/>
      <stop offset="100%" stop-color="#240b0e"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff8bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f2b830" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff094"/>
      <stop offset="50%" stop-color="#ebb02d"/>
      <stop offset="100%" stop-color="#96610c"/>
    </linearGradient>
    <linearGradient id="stoneBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6dce2"/>
      <stop offset="55%" stop-color="#949ea8"/>
      <stop offset="100%" stop-color="#5a636e"/>
    </linearGradient>
  </defs>
  <!-- Framed medieval tile -->
  <rect x="1" y="1" width="34" height="34" rx="3" fill="url(#bgFavour)" stroke="#1c0d0e" stroke-width="1.8"/>
  <rect x="2.5" y="2.5" width="31" height="31" rx="2" fill="none" stroke="#e0b24a" stroke-width="0.9" stroke-opacity="0.75"/>
  <!-- Heavenly light beam -->
  <polygon points="14,4 22,4 30,27 6,27" fill="url(#sunBeam)"/>
  <!-- Radiant star at top -->
  <polygon points="18,4.2 19.3,7.7 23,8 20.1,10.2 21.1,13.8 18,11.8 14.9,13.8 15.9,10.2 13,8 16.7,7.7"
           fill="#fff3a1" stroke="#523308" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- Cut stone block on left -->
  <g stroke="#1b1c20" stroke-width="1.3" stroke-linejoin="round">
    <polygon points="7,21 15,18 20,21.5 12,24.5" fill="#dfe4ea"/>
    <polygon points="7,21 12,24.5 12,30.5 7,27" fill="url(#stoneBlock)"/>
    <polygon points="12,24.5 20,21.5 20,27.5 12,30.5" fill="#7c8794"/>
  </g>
  <!-- Stack of gold coins on right -->
  <g stroke="#291806" stroke-width="1.2" stroke-linejoin="round">
    <ellipse cx="24" cy="28.5" rx="5.5" ry="2.3" fill="#a86e14"/>
    <path d="M18.5 26 L18.5 28.5 A5.5 2.3 0 0 0 29.5 28.5 L29.5 26 Z" fill="#c7881e"/>
    <ellipse cx="24" cy="26" rx="5.5" ry="2.3" fill="url(#coinGold)"/>
    <path d="M18.5 23 L18.5 25.5 A5.5 2.3 0 0 0 29.5 25.5 L29.5 23 Z" fill="#c7881e"/>
    <ellipse cx="24" cy="23" rx="5.5" ry="2.3" fill="url(#coinGold)"/>
    <circle cx="24" cy="18.2" r="4.2" fill="url(#coinGold)"/>
    <line x1="24" y1="16" x2="24" y2="20.4" stroke="#7d4c08" stroke-width="1.1"/>
    <line x1="22.3" y1="18.2" x2="25.7" y2="18.2" stroke="#7d4c08" stroke-width="1.1"/>
  </g>
</svg>
