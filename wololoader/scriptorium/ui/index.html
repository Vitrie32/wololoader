<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptorium — Wololoader Mod Creator</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="graph.css">
  <link rel="stylesheet" href="basic.css">
  <link rel="stylesheet" href="slpcreator.css">
  <link rel="stylesheet" href="slpviewer.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <!-- Hidden element for JS error capture in headless test dumps -->
  <div id="errors" style="display:none;" aria-hidden="true"></div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Generic Modal Dialog Container -->
  <div id="modal-container" class="modal-overlay" style="display:none;"></div>

  <div id="app" class="app-layout">
    <!-- HOME: the mod list. Shown when no mod is open; nothing else is on this page. -->
    <section id="home-view" class="home-view">
      <header class="home-header">
        <div class="home-brand">
          <span class="window-app-crest">W</span>
          <span class="home-brand-name">Scriptorium</span>
        </div>
        <div class="app-status">
          <span class="status-dot connected ping-dot" title="Server status"></span>
          <span class="status-text ping-text">Connected</span>
          <span class="status-sep">|</span>
          <span class="app-version" id="app-version">v2.0</span>
        </div>
      </header>

      <div class="home-toolbar">
        <div class="home-title-group">
          <h2 class="home-title">Mods</h2>
          <span class="home-count" id="home-count"></span>
        </div>
        <div class="search-input-wrapper home-search">
          <input type="text" id="mod-search" placeholder="Search mods..." autocomplete="off">
          <button id="mod-search-clear" class="btn-clear" style="display:none;" title="Clear search">&times;</button>
        </div>
        <button id="btn-open-mods-dir" class="btn btn-wood btn-sm" title="Open the mods folder">Open Mods Folder</button>
      </div>

      <div id="mods-grid" class="mods-grid">
        <!-- Populated dynamically: one card per mod, then the New mod card (app.js renderModCards) -->
      </div>
    </section>

    <!-- EDITOR: one mod. Shown after a mod card is opened or a new mod is created. -->
    <section id="editor-view" class="editor-view" hidden>
      <div class="editor-topbar">
        <button id="btn-back-mods" class="btn btn-ghost btn-sm editor-back" title="Back to the mod list">&lsaquo; All mods</button>
        <div class="editor-topbar-right">
          <span class="status-dot connected ping-dot" title="Server status"></span>
          <span class="status-text ping-text">Connected</span>
        </div>
      </div>

      <div id="mod-workspace" class="mod-workspace">
        <!-- Mod header: identity and the mod-wide actions -->
        <header id="mod-header" class="mod-header">
          <div class="mod-header-left">
            <div class="mod-header-icon" id="mod-header-icon"></div>
            <div class="mod-header-meta">
              <div class="mod-title-row">
                <h2 id="mod-header-name" class="mod-header-name">Mod Name</h2>
                <span id="mod-header-version" class="mod-ver-tag">v0.1</span>
                <span id="unsaved-badge" class="badge-unsaved" style="display:none;">Unsaved changes</span>
              </div>
              <div class="mod-sub-row">
                <span class="mod-author" id="mod-header-author">by Author</span>
                <span class="meta-sep">&bull;</span>
                <label class="toggle-control" title="Enable or disable mod in Wololoader">
                  <input type="checkbox" id="mod-enabled-toggle">
                  <span class="toggle-checkbox-custom"></span>
                  <span class="toggle-label" id="mod-enabled-label">Enabled</span>
                </label>
              </div>
            </div>
          </div>

          <div class="mod-header-actions">
            <button id="btn-mod-details" class="btn btn-wood btn-sm" title="Mod name, version, author and description">Details</button>
            <button id="btn-change-icon" class="btn btn-wood btn-sm" title="Use your own picture as this mod's icon (saved as icon.png)">Icon</button>
            <button id="btn-revert" class="btn btn-wood btn-sm" title="Discard all unsaved changes" disabled>Revert</button>
            <button id="btn-validate" class="btn btn-wood btn-sm" title="Test building this mod into dat with wl_dat_build">Validate</button>
            <button id="btn-save" class="btn btn-wood btn-sm btn-save" title="Save everything in this mod (Ctrl+S)">
              <span>Save</span>
              <kbd class="kbd-hint">Ctrl+S</kbd>
            </button>
            <button id="btn-open-mod-folder" class="btn btn-wood btn-sm" title="Open this mod's folder">Folder</button>
          </div>
        </header>

        <div class="mod-body">
          <!-- Left navigation: one entry per kind of content, with a count (sections.js) -->
          <nav id="mod-nav" class="mod-nav" aria-label="Mod contents"></nav>

          <!-- Main column: the section page (sections.js, basic.js), or the Sprites viewer -->
          <main class="mod-main">
            <div id="basic-root" class="basic-root"></div>
            <div id="sprites-view" class="sprites-view" hidden></div>
          </main>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
  <script src="slpcreator.js"></script>
  <script src="slpdecode.js"></script>
  <script src="gamedata.js"></script>
  <script src="slpviewer.js"></script>
  <script src="graph.js"></script>
  <script src="basic.js"></script>
  <script src="sections.js"></script>
</body>
</html>
